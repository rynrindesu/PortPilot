AWSTemplateFormatVersion: "2010-09-09"
Description: >
  PortPilot Harbour Control console - private S3 origin behind CloudFront with
  Origin Access Control. Single-page-app routing is handled by mapping S3's
  403/404 back to index.html so deep links such as /port-calls/SGSIN-2603 work.

Parameters:
  ProjectName:
    Type: String
    Default: portpilot-console
    Description: Prefix for resource names.
    AllowedPattern: "[a-z0-9-]{3,40}"

  PriceClass:
    Type: String
    Default: PriceClass_200
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    Description: >
      PriceClass_200 includes Asia-Pacific edge locations (Singapore).
      PriceClass_100 is North America + Europe only and is marginally cheaper.

  ApiOriginDomain:
    Type: String
    Default: ""
    Description: >
      Optional. Public DNS name of the backend host (the ApiOriginDomain output
      of backend-ec2.yaml). When set, /api/* is routed to it through this same
      distribution, so the browser sees one HTTPS origin - no CORS, no mixed
      content, no certificate needed on the instance. Leave empty to ship the
      console on its bundled demo dataset.

Conditions:
  HasApiOrigin: !Not [!Equals [!Ref ApiOriginDomain, ""]]

Resources:
  # ---------------------------------------------------------------
  # Origin bucket - never public; CloudFront reads it through OAC.
  # ---------------------------------------------------------------
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-${AWS::AccountId}-${AWS::Region}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Suspended

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-oac"
        Description: Lets this distribution read the private site bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ---------------------------------------------------------------
  # Security headers. The console loads Google Fonts and nothing else
  # off-origin, so the CSP can stay tight.
  # ---------------------------------------------------------------
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${ProjectName}-security-headers"
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${ProjectName} - PortPilot operations console"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        DefaultRootObject: index.html
        Origins:
          - Id: SiteBucketOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - !If
            - HasApiOrigin
            - Id: ApiOrigin
              DomainName: !Ref ApiOriginDomain
              CustomOriginConfig:
                OriginProtocolPolicy: http-only
                HTTPPort: 80
                OriginReadTimeout: 60
                OriginKeepaliveTimeout: 5
            - !Ref AWS::NoValue
        CacheBehaviors: !If
          - HasApiOrigin
          - - PathPattern: /api/*
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: https-only
              Compress: true
              AllowedMethods:
                [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachedMethods: [GET, HEAD]
              # Managed-CachingDisabled - API responses are per-request state.
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              # Managed-AllViewer - forward headers, cookies and query strings.
              OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          - !Ref AWS::NoValue
        DefaultCacheBehavior:
          TargetOriginId: SiteBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        CustomErrorResponses:
          # React Router owns the URL space; hand every unknown path to the app.
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  BucketName:
    Description: Upload the built bundle here.
    Value: !Ref SiteBucket
    Export:
      Name: !Sub "${AWS::StackName}-BucketName"

  DistributionId:
    Description: Invalidate this distribution after each upload.
    Value: !Ref Distribution
    Export:
      Name: !Sub "${AWS::StackName}-DistributionId"

  ConsoleUrl:
    Description: Public URL of the console.
    Value: !Sub "https://${Distribution.DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-ConsoleUrl"
