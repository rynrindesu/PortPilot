[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portpilot"
version = "0.1.0"
description = "Agentic AI maritime operations platform"
dependencies = [
    "requests",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "psycopg[binary,pool]",
    "langchain-core",
    "langgraph",
]

[tool.setuptools.packages.find]
where = ["src"]
