[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portpilot"
version = "0.1.0"
description = "Agentic AI maritime operations platform"
dependencies = [
    "requests",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "psycopg[binary,pool]",
    "langchain-core",
    "langgraph",
    "langchain-groq",
]

[project.optional-dependencies]
# Only needed once LLM_PROVIDER=bedrock (see agent.py's create_model()) -
# install with: pip install -e ".[bedrock]"
bedrock = ["langchain-aws", "boto3"]

[tool.setuptools.packages.find]
where = ["src"]
